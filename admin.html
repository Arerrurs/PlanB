<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мудрость дня — Админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="admin-page">
    <section class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>Админка</h1>
          <p id="adminStatus" class="admin-subtitle">Проверяем доступ...</p>
        </div>
        <div class="topbar-actions">
          <a class="icon-btn" href="./index.html" aria-label="На главную" title="На главную">
            <span class="material-symbols-outlined">home</span>
          </a>
          <button id="adminThemeBtn" class="icon-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
            <span class="material-symbols-outlined">contrast</span>
          </button>
        </div>
      </header>

      <section id="accessDenied" class="panel hidden">
        <p>У тебя нет доступа к этой странице.</p>
      </section>

      <div id="adminContent" class="hidden">
        <section class="stats-grid">
          <article class="stat-card">
            <span>Цитат</span>
            <strong id="statQuotes">0</strong>
          </article>
          <article class="stat-card">
            <span>На модерации</span>
            <strong id="statSuggestions">0</strong>
          </article>
          <article class="stat-card">
            <span>Лайков</span>
            <strong id="statLikes">0</strong>
          </article>
          <article class="stat-card">
            <span>Дизлайков</span>
            <strong id="statDislikes">0</strong>
          </article>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Добавить цитату</h2>
          </div>
          <div class="stack-form">
            <label class="field">
              <textarea id="newQuoteText" rows="4" placeholder="Текст цитаты..."></textarea>
            </label>
            <div class="row-actions single">
              <button id="addQuoteBtn" class="text-btn primary" type="button">Добавить</button>
            </div>
            <div id="adminMessage" class="message"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Цитаты</h2>
            <button id="reloadQuotesBtn" class="icon-btn" type="button" aria-label="Обновить" title="Обновить">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div id="quotesList" class="admin-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Предложенные цитаты</h2>
            <button id="reloadSuggestionsBtn" class="icon-btn" type="button" aria-label="Обновить" title="Обновить">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <div id="suggestionsList" class="admin-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
