<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мудрость дня — Админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="admin-page">
    <section class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>Админка</h1>
          <p id="adminStatus" class="admin-subtitle">Проверяем доступ...</p>
        </div>
        <div class="topbar-actions">
          <a class="icon-btn" href="./index.html" aria-label="На главную" title="На главную">
            <span class="material-symbols-outlined">home</span>
          </a>
          <button id="adminThemeBtn" class="icon-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
            <span class="material-symbols-outlined">contrast</span>
          </button>
          <button id="refreshAdminBtn" class="icon-btn" type="button" aria-label="Обновить всё" title="Обновить всё">
            <span class="material-symbols-outlined">refresh</span>
          </button>
        </div>
      </header>

      <section id="accessDenied" class="panel hidden">
        <p>У тебя нет доступа к этой странице.</p>
      </section>

      <div id="adminContent" class="hidden">
        <section class="panel collapsible-panel" data-panel="stats">
          <div class="panel-head">
            <h2>Статистика</h2>
            <button class="icon-btn panel-toggle" type="button" data-panel-toggle="stats" aria-label="Свернуть раздел">
              <span class="material-symbols-outlined">expand_less</span>
            </button>
          </div>
          <div class="panel-content" data-panel-content="stats">
            <section class="stats-grid">
              <article class="stat-card">
                <span>Цитат</span>
                <strong id="statQuotes">0</strong>
              </article>
              <article class="stat-card">
                <span>На модерации</span>
                <strong id="statSuggestions">0</strong>
              </article>
              <article class="stat-card">
                <span>Лайков</span>
                <strong id="statLikes">0</strong>
              </article>
              <article class="stat-card">
                <span>Дизлайков</span>
                <strong id="statDislikes">0</strong>
              </article>
            </section>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="addQuote">
          <div class="panel-head">
            <h2>Добавить цитату</h2>
            <button class="icon-btn panel-toggle" type="button" data-panel-toggle="addQuote" aria-label="Свернуть раздел">
              <span class="material-symbols-outlined">expand_less</span>
            </button>
          </div>
          <div class="panel-content" data-panel-content="addQuote">
            <div class="stack-form">
              <label class="field">
                <textarea id="newQuoteText" rows="4" placeholder="Текст цитаты..."></textarea>
              </label>
              <div class="row-actions single">
                <button id="addQuoteBtn" class="text-btn primary" type="button">Добавить</button>
              </div>
              <div id="adminMessage" class="message"></div>
            </div>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="users">
          <div class="panel-head">
            <h2>Пользователи</h2>
            <button class="icon-btn panel-toggle" type="button" data-panel-toggle="users" aria-label="Свернуть раздел">
              <span class="material-symbols-outlined">expand_less</span>
            </button>
          </div>
          <div class="panel-content" data-panel-content="users">
            <div id="usersSummary" class="admin-subtitle panel-subtitle">Всего: 0</div>
            <div id="usersList" class="admin-list compact-list"></div>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="quotes">
          <div class="panel-head">
            <h2>Цитаты</h2>
            <button class="icon-btn panel-toggle" type="button" data-panel-toggle="quotes" aria-label="Свернуть раздел">
              <span class="material-symbols-outlined">expand_less</span>
            </button>
          </div>
          <div class="panel-content" data-panel-content="quotes">
            <div class="toolbar-row">
              <label class="select-wrap">
                <span>Сортировка</span>
                <select id="quoteSortSelect" class="select-control">
                  <option value="newest">Сначала новые</option>
                  <option value="likes_desc">Самые лайкнутые</option>
                  <option value="dislikes_desc">Самые дизлайкнутые</option>
                </select>
              </label>
            </div>
            <div id="quotesList" class="admin-list"></div>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="suggestions">
          <div class="panel-head">
            <h2>Предложенные цитаты</h2>
            <button class="icon-btn panel-toggle" type="button" data-panel-toggle="suggestions" aria-label="Свернуть раздел">
              <span class="material-symbols-outlined">expand_less</span>
            </button>
          </div>
          <div class="panel-content" data-panel-content="suggestions">
            <div id="suggestionsList" class="admin-list"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="editQuoteModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="editQuoteModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Редактировать цитату</h2>
        <button class="icon-btn" type="button" data-close="editQuoteModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="editQuoteForm" class="stack-form">
          <input id="editQuoteId" type="hidden" />
          <label class="field">
            <textarea id="editQuoteText" rows="6" placeholder="Текст цитаты..."></textarea>
          </label>
          <div class="row-actions">
            <button id="saveQuoteBtn" class="text-btn primary" type="button">Сохранить</button>
            <button id="cancelEditBtn" class="text-btn" type="button" data-close="editQuoteModal">Отмена</button>
          </div>
          <div id="editQuoteMessage" class="message"></div>
        </form>
      </div>
    </div>
  </div>



  <div id="voteDetailsModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="voteDetailsModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="voteDetailsTitle">Кто голосовал</h2>
        <button class="icon-btn" type="button" data-close="voteDetailsModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="voteDetailsMessage" class="message"></div>
        <div id="voteDetailsList" class="admin-list compact-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
