<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка — Мудрость дня</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <h1>Админка</h1>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" type="button">◐</button>
        <a class="pill-btn secondary" href="./index.html">На главную</a>
      </div>
    </header>

    <div class="status-line" id="adminStatus"></div>

    <section class="quote-card" id="adminWrap">
      <div class="field">
        <span>Поиск по цитатам</span>
        <input class="search-input" id="searchQuotes" type="text" placeholder="Введите слово..." />
      </div>
      <div class="field">
        <span>Сортировка</span>
        <select class="search-input" id="sortSelect">
          <option value="new">Сначала новые</option>
          <option value="likes">Сначала самые лайкнутые</option>
          <option value="dislikes">Сначала самые дизлайкнутые</option>
        </select>
      </div>
      <div class="field">
        <span>Новая цитата</span>
        <textarea id="newQuoteText" rows="4"></textarea>
      </div>
      <div class="modal-actions">
        <button class="pill-btn" id="addQuoteBtn" type="button">Добавить</button>
      </div>
      <div class="status-line" id="addQuoteStatus"></div>

      <details open>
        <summary><strong>Цитаты</strong></summary>
        <div id="quotesList" class="quote-list"></div>
      </details>

      <details>
        <summary><strong>Предложенные цитаты</strong></summary>
        <div id="suggestionsList" class="quote-list"></div>
      </details>

      <details>
        <summary><strong>Пользователи</strong></summary>
        <div id="usersList" class="quote-list"></div>
      </details>
    </section>
  </div>

  <div class="modal hidden" id="voteModal">
    <div class="modal-backdrop" data-close="voteModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Кто голосовал</h2>
        <button class="icon-btn" data-close="voteModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div id="voteModalContent" class="quote-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
