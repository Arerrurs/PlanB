<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мудрость дня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-block">
      <span class="eyebrow">Минималистичная библиотека народного мрака</span>
      <h1>Мудрость дня</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему">
        <span class="material-symbols-outlined">contrast</span>
      </button>
      <a class="ghost-link hidden" id="adminLink" href="./admin.html">Админка</a>
      <button class="ghost-link" id="authToggleBtn" type="button">Войти</button>
      <button class="ghost-link hidden" id="logoutBtn" type="button">Выйти</button>
    </div>
  </header>

  <main class="layout">
    <section class="quote-card glass">
      <div class="quote-toolbar">
        <button class="icon-btn" id="refreshBtn" title="Другая цитата" aria-label="Другая цитата">
          <span class="material-symbols-outlined">refresh</span>
        </button>
        <button class="icon-btn" id="copyBtn" title="Скопировать" aria-label="Скопировать">
          <span class="material-symbols-outlined">content_copy</span>
        </button>
        <button class="icon-btn" id="shareBtn" title="Поделиться" aria-label="Поделиться">
          <span class="material-symbols-outlined">ios_share</span>
        </button>
      </div>

      <p class="quote-text" id="quoteText">Загрузка цитаты…</p>

      <div class="quote-footer">
        <div class="votes">
          <button class="vote-btn" id="likeBtn" type="button">
            <span class="material-symbols-outlined">thumb_up</span>
            <span>Нравится</span>
            <strong id="likeCount">0</strong>
          </button>
          <button class="vote-btn" id="dislikeBtn" type="button">
            <span class="material-symbols-outlined">thumb_down</span>
            <span>Не нравится</span>
            <strong id="dislikeCount">0</strong>
          </button>
        </div>
        <p class="status" id="quoteStatus"></p>
      </div>
    </section>

    <aside class="side-stack">
      <section class="panel glass auth-panel" id="authPanel">
        <div class="panel-heading">
          <h2>Вход и регистрация</h2>
          <p>Нужны, чтобы лайкать, дизлайкать и отправлять свои цитаты.</p>
        </div>
        <form id="authForm" class="stack-form">
          <label>
            <span>Email</span>
            <input type="email" id="emailInput" placeholder="you@example.com" required />
          </label>
          <label>
            <span>Пароль</span>
            <input type="password" id="passwordInput" placeholder="Минимум 6 символов" required minlength="6" />
          </label>
          <div class="row-buttons">
            <button class="primary-btn" type="submit" data-mode="login">Войти</button>
            <button class="secondary-btn" type="button" id="signupBtn">Регистрация</button>
          </div>
          <p class="status" id="authStatus"></p>
        </form>
      </section>

      <section class="panel glass">
        <div class="panel-heading">
          <h2>Предложить цитату</h2>
          <p>Текст уйдёт на модерацию, а потом появится в общем списке.</p>
        </div>
        <form id="suggestForm" class="stack-form">
          <label>
            <span>Твоя мудрость</span>
            <textarea id="suggestionInput" rows="5" placeholder="Вставь цитату сюда" required></textarea>
          </label>
          <button class="primary-btn" type="submit">Отправить</button>
          <p class="status" id="suggestStatus"></p>
        </form>
      </section>
    </aside>
  </main>

  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
