<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мудрость дня</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&family=Cormorant:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #111;
      --accent: #6c63ff;
    }

    body.dark {
      --bg: #111;
      --card: #1e1e1e;
      --text: #eee;
      --accent: #8b85ff;
    }

    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: 0.3s;
    }

    .card {
      position: relative;
      max-width: 600px;
      padding: 40px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .quote {
      font-size: 24px;
      font-family: 'Cormorant', serif;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 14px;
      opacity: 0.7;
    }

    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 18px;
      color: var(--text);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      cursor: pointer;
      font-size: 18px;
    }

  </style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">🌗</div>

<div class="card">
  <div class="controls">
    <button class="icon-btn" onclick="copyQuote()">📋</button>
    <button class="icon-btn" onclick="shareQuote()">📤</button>
  </div>

  <div class="quote" id="quote">Загрузка...</div>
  <div class="timer" id="timer"></div>
</div>

<script>
let quotes = [];

async function loadQuotes() {
  const res = await fetch('quotes.txt');
  const text = await res.text();
  quotes = text.split('\n').filter(q => q.trim() !== '');
  setDailyQuote();
}

function setDailyQuote() {
  const today = new Date().toDateString();
  let saved = localStorage.getItem('quote');

  if (saved) {
    const data = JSON.parse(saved);
    if (data.date === today) {
      showQuote(data.text);
      return;
    }
  }

  const random = quotes[Math.floor(Math.random() * quotes.length)];
  localStorage.setItem('quote', JSON.stringify({
    date: today,
    text: random
  }));

  showQuote(random);
}

function showQuote(text) {
  document.getElementById('quote').innerText = text;
}

function copyQuote() {
  const text = document.getElementById('quote').innerText;
  navigator.clipboard.writeText(text);
  alert("Скопировано");
}

function shareQuote() {
  const text = document.getElementById('quote').innerText;

  if (navigator.share) {
    navigator.share({
      title: 'Мудрость дня',
      text: text,
      url: window.location.href
    });
  } else {
    copyQuote();
    alert("Скопировано для шаринга");
  }
}

function toggleTheme() {
  document.body.classList.toggle('dark');
}

function updateTimer() {
  const now = new Date();
  const midnight = new Date();
  midnight.setHours(24,0,0,0);

  const diff = midnight - now;

  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor(diff / 1000 / 60 % 60);
  const s = Math.floor(diff / 1000 % 60);

  document.getElementById('timer').innerText =
    `Новая мудрость через: ${h}ч ${m}м ${s}с`;
}

setInterval(updateTimer, 1000);

loadQuotes();
updateTimer();
</script>

</body>
</html>
