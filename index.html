<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мудрость дня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <section class="quote-card">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <span class="material-symbols-outlined">auto_stories</span>
        </div>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
            <span class="material-symbols-outlined">contrast</span>
          </button>
          <button id="accountBtn" class="icon-btn" type="button" aria-label="Войти" title="Войти">
            <span class="material-symbols-outlined">person</span>
          </button>
        </div>
      </header>

      <div class="quote-body">
        <p id="quoteText" class="quote-text">Загрузка цитаты...</p>
        <input id="quoteId" type="hidden" />
      </div>

      <footer class="quote-actions">
        <div class="left-actions">
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Обновить цитату" title="Обновить">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <button id="copyBtn" class="icon-btn" type="button" aria-label="Скопировать цитату" title="Скопировать">
            <span class="material-symbols-outlined">content_copy</span>
          </button>
          <button id="shareBtn" class="icon-btn" type="button" aria-label="Поделиться цитатой" title="Поделиться">
            <span class="material-symbols-outlined">ios_share</span>
          </button>
        </div>
        <div class="right-actions">
          <button id="likeBtn" class="icon-btn vote-btn" type="button" aria-label="Нравится" title="Нравится">
            <span class="material-symbols-outlined">thumb_up</span>
          </button>
          <button id="dislikeBtn" class="icon-btn vote-btn" type="button" aria-label="Не нравится" title="Не нравится">
            <span class="material-symbols-outlined">thumb_down</span>
          </button>
        </div>
      </footer>

      <div id="globalMessage" class="message" aria-live="polite"></div>
    </section>
  </main>

  <div id="authModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="authModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Вход</h2>
        <button class="icon-btn" type="button" data-close="authModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="authForm" class="stack-form">
          <label class="field">
            <span>Почта</span>
            <input id="email" type="email" autocomplete="email" placeholder="mail@example.com" />
          </label>
          <label class="field">
            <span>Пароль</span>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
          </label>
          <div class="row-actions">
            <button id="signInBtn" class="text-btn primary" type="button">Войти</button>
            <button id="signUpBtn" class="text-btn" type="button">Регистрация</button>
          </div>
          <div id="authMessage" class="message" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>

  <div id="accountModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="accountModal"></div>
    <div class="modal-dialog slim">
      <div class="modal-header">
        <h2>Личный кабинет</h2>
        <button class="icon-btn" type="button" data-close="accountModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body account-body">
        <div class="account-email" id="userEmail">—</div>

        <label class="setting-row">
          <span>Не показывать дизлайкнутые</span>
          <input id="hideDislikedToggle" type="checkbox" />
        </label>

        <div class="stack-buttons">
          <button id="openFavoritesBtn" class="text-btn" type="button">Любимые цитаты</button>
          <button id="openSuggestionBtn" class="text-btn primary" type="button">Предложить цитату</button>
          <a id="adminLink" class="text-btn ghost hidden-link" href="./admin.html">Админка</a>
          <button id="signOutBtn" class="text-btn danger" type="button">Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <div id="suggestionModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="suggestionModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Предложить цитату</h2>
        <button class="icon-btn" type="button" data-close="suggestionModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="suggestionForm" class="stack-form">
          <label class="field">
            <textarea id="suggestionText" rows="6" placeholder="Напиши цитату..."></textarea>
          </label>
          <div class="row-actions single">
            <button id="suggestionBtn" class="text-btn primary" type="button">Отправить</button>
          </div>
          <div id="suggestionMessage" class="message" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>

  <div id="favoritesModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="favoritesModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Любимые цитаты</h2>
        <button class="icon-btn" type="button" data-close="favoritesModal" aria-label="Закрыть">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="favoritesMessage" class="message" aria-live="polite"></div>
        <div id="favoritesList" class="favorites-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
