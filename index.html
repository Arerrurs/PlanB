<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мудрость дня</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <button class="bookmark-btn icon-btn" id="statsBtn" aria-label="Открыть статистику">
        <img src="./favicon.svg" alt="" class="bookmark-icon" />
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">◐</button>
        <button class="icon-btn hidden" id="userBtn" aria-label="Личный кабинет">👤</button>
        <button class="pill-btn" id="openLoginBtn" type="button">Вход</button>
        <button class="pill-btn secondary" id="openRegisterBtn" type="button">Регистрация</button>
      </div>
    </header>

    <main class="main-wrap">
      <section class="quote-card">
        <div class="quote-topline">
          <div class="quote-meta" id="timerText">Обновление через 01:00</div>
          <div class="quote-id" id="quotePermalinkHint"></div>
        </div>

        <blockquote class="quote-text" id="quoteText">Загрузка цитаты…</blockquote>

        <div class="quote-actions">
          <button class="icon-btn vote-btn" id="likeBtn" type="button" aria-label="Лайк">👍</button>
          <button class="icon-btn vote-btn" id="dislikeBtn" type="button" aria-label="Дизлайк">👎</button>
          <button class="pill-btn secondary" id="shareTextBtn" type="button">Текст и ссылка</button>
          <button class="pill-btn secondary" id="shareCardBtn" type="button">Карточка</button>
          <button class="pill-btn secondary" id="refreshBtn" type="button">Другая цитата</button>
        </div>

        <div class="status-line" id="globalStatus"></div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="loginModal">
    <div class="modal-backdrop" data-close="loginModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Вход</h2>
        <button class="icon-btn" data-close="loginModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Почта или логин</span>
          <input id="loginIdentity" type="text" autocomplete="username" />
        </label>
        <label class="field">
          <span>Пароль</span>
          <input id="loginPassword" type="password" autocomplete="current-password" />
        </label>
        <div class="modal-actions">
          <button class="pill-btn" id="loginSubmitBtn" type="button">Войти</button>
          <button class="pill-btn secondary" id="switchToRegisterBtn" type="button">Регистрация</button>
        </div>
        <div class="status-line" id="loginStatus"></div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="registerModal">
    <div class="modal-backdrop" data-close="registerModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Регистрация</h2>
        <button class="icon-btn" data-close="registerModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Почта</span>
          <input id="registerEmail" type="email" autocomplete="email" />
        </label>
        <label class="field">
          <span>Логин</span>
          <input id="registerUsername" type="text" autocomplete="username" />
        </label>
        <label class="field">
          <span>Пароль</span>
          <input id="registerPassword" type="password" autocomplete="new-password" />
        </label>
        <div class="hint">Для текущих пользователей логин можно добавить позже в настройках.</div>
        <div class="modal-actions">
          <button class="pill-btn" id="registerSubmitBtn" type="button">Создать аккаунт</button>
          <button class="pill-btn secondary" id="switchToLoginBtn" type="button">Уже есть аккаунт</button>
        </div>
        <div class="status-line" id="registerStatus"></div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="cabinetModal">
    <div class="modal-backdrop" data-close="cabinetModal"></div>
    <div class="modal-dialog modal-dialog-lg">
      <div class="modal-header">
        <h2>Личный кабинет</h2>
        <div class="header-inline-actions">
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Настройки">⚙</button>
          <button class="icon-btn" data-close="cabinetModal" type="button">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="cabinet-summary">
          <div><strong>Почта:</strong> <span id="cabinetEmail">—</span></div>
          <div><strong>Логин:</strong> <span id="cabinetUsername">—</span></div>
          <div class="admin-link-wrap"><a class="hidden" id="adminLink" href="./admin.html">Открыть админку</a></div>
        </div>

        <div class="tab-row">
          <button class="tab-btn active" data-tab="likedTab" type="button">Любимые цитаты</button>
          <button class="tab-btn" data-tab="dislikedTab" type="button">Не любимые цитаты</button>
          <button class="tab-btn" data-tab="suggestTab" type="button">Предложить цитату</button>
        </div>

        <div class="tab-panel active" id="likedTab">
          <div class="mode-selector" id="likedModeSelector">
            <button class="mode-btn active" data-mode="all" type="button">Все</button>
            <button class="mode-btn" data-mode="only" type="button">Только лайкнутые</button>
            <button class="mode-btn" data-mode="hide" type="button">Скрыть лайкнутые</button>
          </div>
          <div class="quote-list" id="likedList"></div>
        </div>

        <div class="tab-panel" id="dislikedTab">
          <div class="mode-selector" id="dislikedModeSelector">
            <button class="mode-btn active" data-mode="all" type="button">Все</button>
            <button class="mode-btn" data-mode="only" type="button">Только дизлайкнутые</button>
            <button class="mode-btn" data-mode="hide" type="button">Скрыть дизлайкнутые</button>
          </div>
          <div class="quote-list" id="dislikedList"></div>
        </div>

        <div class="tab-panel" id="suggestTab">
          <label class="field">
            <span>Текст цитаты</span>
            <textarea id="suggestionText" rows="5"></textarea>
          </label>
          <div class="modal-actions">
            <button class="pill-btn" id="suggestionSubmitBtn" type="button">Отправить</button>
          </div>
          <div class="status-line" id="suggestionStatus"></div>
        </div>

        <div class="cabinet-bottom-controls">
          <label class="checkbox-row">
            <input type="checkbox" id="disableTimerCheckbox" />
            <span>Не использовать таймер</span>
          </label>
          <button class="pill-btn danger" id="logoutBtn" type="button">Выйти</button>
        </div>
        <div class="status-line" id="cabinetStatus"></div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="settingsModal">
    <div class="modal-backdrop" data-close="settingsModal"></div>
    <div class="modal-dialog modal-dialog-lg">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button class="icon-btn" data-close="settingsModal" type="button">✕</button>
      </div>
      <div class="modal-body modal-scroll">
        <label class="field">
          <span>Почта</span>
          <input id="settingsEmail" type="email" />
        </label>
        <div class="hint">Смена почты у Supabase идёт через письмо-подтверждение.</div>

        <label class="field">
          <span>Логин для входа</span>
          <input id="settingsUsername" type="text" />
        </label>

        <label class="field">
          <span>Новый пароль</span>
          <input id="settingsPassword" type="password" />
        </label>

        <div class="field-group">
          <label class="field">
            <span>Акцент для светлой темы</span>
            <input id="lightAccentInput" type="color" />
          </label>
          <label class="field">
            <span>Акцент для тёмной темы</span>
            <input id="darkAccentInput" type="color" />
          </label>
        </div>

        <div class="modal-actions sticky-actions">
          <button class="pill-btn" id="saveSettingsBtn" type="button">Сохранить</button>
        </div>
        <div class="status-line" id="settingsStatus"></div>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="statsModal">
    <div class="modal-backdrop" data-close="statsModal"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Статистика</h2>
        <button class="icon-btn" data-close="statsModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div id="statsContent" class="stats-box">Загрузка...</div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
